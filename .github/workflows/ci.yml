name: CI
on:
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Typecheck, build and validate the static site
        run: |
          docker run --rm -v "$PWD:/app" -w /app -e HUSKY=0 -e CI=true -e BUN_CONFIG_MAX_HTTP_REQUESTS=16 oven/bun:1.4.4@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d sh -c 'bun install --frozen-lockfile --network-concurrency=16 && bun run typecheck && bun run build && bun run check:site && bun run format:check'
      - name: Deployment provenance, queue and rollback tests
        run: python3 -B -m unittest discover -s deploy -p 'test_*.py' -v
      - name: Webhook authentication and acceptance tests
        run: node --test deploy/receiver/server.test.mjs
      - name: Verify the production container without privileges
        run: |
          docker build -t jaiscudderplumbing:ci --build-arg PLUMBING_REVISION="$GITHUB_SHA" .
          docker network create platform-web
          trap 'PLUMBING_IMAGE=jaiscudderplumbing:ci docker compose down; docker network rm platform-web' EXIT
          PLUMBING_IMAGE=jaiscudderplumbing:ci docker compose up -d --wait --wait-timeout 60
          docker exec jaiscudderplumbing-jaiscudderplumbing-1 wget -qO- http://127.0.0.1:8080/ | grep -q 'JAI SCUDDER LTD'
          docker exec jaiscudderplumbing-jaiscudderplumbing-1 wget -qO- http://127.0.0.1:8080/healthz | grep -q "\"revision\":\"$GITHUB_SHA\""
          headers=$(docker exec jaiscudderplumbing-jaiscudderplumbing-1 wget -S -O /dev/null http://127.0.0.1:8080/ 2>&1)
          echo "$headers" | grep -qi "X-Jaiscudderplumbing-Revision: $GITHUB_SHA"
          status=$(docker exec jaiscudderplumbing-jaiscudderplumbing-1 wget -S -O /dev/null http://127.0.0.1:8080/missing-page 2>&1 || true)
          echo "$status" | grep -q '404 Not Found'
